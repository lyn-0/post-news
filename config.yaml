# ============================================
#  興味のあるトピック設定
#  ここを書き換えるだけで収集対象が変わります
# ============================================

timezone: Asia/Tokyo

# 1回の実行で投稿する記事数。2本以上なら30分ずつずらして予約される
posts_per_run: 1

# 何時間前までの記事を候補にするか
lookback_hours: 30

# 投稿時刻（JST）。Buffer 側の予約に使うので、スクリプトの実行時刻とは独立。
# ジョブがこの時刻より後に走った場合は翌日ぶんとして予約される。
schedule_at: "09:30"

# 本文にリンクを含めるか。
# Buffer 経由なら X の従量課金（リンク付き $0.20）は発生しないので true でよい。
include_link: true

topics:
  - name: "AI / LLM"
    qiita_tags: ["LLM", "OpenAI", "生成AI"]
    feeds:
      # Ledge.ai は公式RSSが無いため、有志が自動生成しているフィードを使う
      # （https://github.com/yoshiori/ledge-ai-feed / 毎時更新）
      - https://yoshiori.github.io/ledge-ai-feed/rss.xml
      - https://www.itmedia.co.jp/aiplus/subtop/features/rss.xml
      - https://zenn.dev/topics/llm/feed

  - name: "テック全般"
    feeds:
      # GIGAZINE のRSSは全カテゴリ混在（試食・アニメ・食なども流れてくる）。
      # include_categories で技術系だけに絞る。カテゴリ名は記事下部の表記と同じ
      - url: https://gigazine.net/news/rss_2.0/
        include_categories:
          - AI
          - ソフトウェア
          - ネットサービス
          - ハードウェア
          - セキュリティ
          - ウェブアプリ
          - サイエンス
      - https://www.publickey1.jp/atom.xml

  - name: "フロントエンド / Web開発"
    qiita_tags: ["React", "Next.js", "TypeScript"]
    feeds:
      - https://zenn.dev/topics/frontend/feed
      - https://developer.mozilla.org/en-US/blog/rss.xml
      - https://github.blog/feed/

  - name: "アクセシビリティ / SEO"
    qiita_tags: ["アクセシビリティ", "SEO"]
    feeds:
      - https://zenn.dev/topics/accessibility/feed

# Qiita を使う場合はここを true に。設定はそのまま残してある
qiita:
  enabled: false
  min_likes: 100
  lookback_days: 60
  token_env: QIITA_TOKEN

# ============================================
#  記事の選定ルール（LLMは使わない）
# ============================================
selection:
  # 新しさの半減期（時間）。小さいほど「今朝出た記事」が有利になる。
  # 目安は「収集期間の 1/4」。RSS のみ（lookback_hours: 30）なら 8〜12。
  # Qiita を再開して lookback_days を伸ばす場合はここも伸ばすこと。
  recency_half_life_hours: 8

  # 信頼する媒体に加点。URL か媒体名に含まれる文字列でマッチ
  source_weights:
    publickey1.jp: 1.4
    itmedia.co.jp: 1.2
    zenn.dev: 1.1
    ledge.ai: 1.2
    gigazine.net: 1.0
    developer.mozilla.org: 1.4
    web.dev: 1.4
    github.blog: 1.3

  # エンゲージメント指標を持たない記事（RSS由来）に与える擬似スコア。
  # RSS のみで運用している間は全記事が同じ値になるので、実質的に効かない。
  # Qiita を併用するときだけ意味を持つ
  feed_base_score: 60

  # タイトルがこれより短い記事は捨てる（文字数）
  min_title_length: 8

  # タイトル末尾の媒体名（" - ITmedia NEWS" など）を落とす
  strip_source_from_title: true

  # 追加の除外パターン（正規表現）。PR・広告・まとめ系は既定で除外済み
  exclude_patterns: []

  # トピックごとに末尾へ付けるハッシュタグ
  hashtags_by_topic:
    "AI / LLM": "#AI"
    "フロントエンド / Web開発": "#frontend"
    "アクセシビリティ / SEO": "#a11y"
    "テック全般": "#tech"
