# ============================================
#  興味のあるトピック設定
#  ここを書き換えるだけで収集対象が変わります
# ============================================

timezone: Asia/Tokyo

# 1回の実行で投稿する記事数。2本以上なら30分ずつずらして予約される
posts_per_run: 1

# 何時間前までの記事を候補にするか。
# 短すぎると候補が枯れる。更新頻度の低いフィードを含むなら 72〜120 くらい必要。
# ここを伸ばしても、新しい記事ほど有利になる減衰は効いたまま
lookback_hours: 96

# 投稿時刻（JST）。Buffer 側の予約に使うので、スクリプトの実行時刻とは独立。
# ジョブがこの時刻より後に走った場合は翌日ぶんとして予約される。
schedule_at: "09:30"

# 本文にリンクを含めるか。
# Buffer 経由なら X の従量課金（リンク付き $0.20）は発生しないので true でよい。
include_link: true

topics:
  - name: "AI / LLM"
    zenn_topics: ["llm", "生成ai", "openai"]
    qiita_tags: ["LLM", "OpenAI", "生成AI"]
    feeds:
      # Ledge.ai は公式RSSが無いため、有志が自動生成しているフィードを使う
      # （https://github.com/yoshiori/ledge-ai-feed / 毎時更新）
      - https://yoshiori.github.io/ledge-ai-feed/rss.xml
      # ITmedia の正式なフィードURL一覧: https://corp.itmedia.co.jp/media/rss_list/
      - https://rss.itmedia.co.jp/rss/2.0/aiplus.xml

  - name: "テック全般"
    feeds:
      # GIGAZINE のRSSは全カテゴリ混在（試食・アニメ・食なども流れてくる）。
      # include（許可リスト）は表記が1文字でも違うと全滅するので、
      # exclude（除外リスト）で不要なものだけ落とす。こちらは外れても記事は残る。
      # 実際のカテゴリ名は `--check-feeds` の出力からコピーすること
      - url: https://gigazine.net/news/rss_2.0/
        exclude_categories:
          - 試食
          - 食
          - アニメ
          - マンガ
          - 映画
          - ゲーム
          - 生き物
          - 乗り物
          - 広告
          - お知らせ
      - https://www.publickey1.jp/atom.xml
      - https://rss.itmedia.co.jp/rss/2.0/news_bursts.xml
      - https://rss.itmedia.co.jp/rss/2.0/news_security.xml

  - name: "フロントエンド / Web開発"
    zenn_topics: ["react", "nextjs", "typescript", "frontend"]
    qiita_tags: ["React", "Next.js", "TypeScript"]
    feeds:
      - https://rss.itmedia.co.jp/rss/2.0/ait.xml
      - https://developer.mozilla.org/en-US/blog/rss.xml
      - https://github.blog/feed/

  - name: "アクセシビリティ / SEO"
    zenn_topics: ["accessibility", "seo"]
    qiita_tags: ["アクセシビリティ", "SEO"]
    feeds:
      - https://rss.itmedia.co.jp/rss/2.0/marketing_web.xml

# Zenn はいいね数（♥）が RSS に入っていないため、サイト内部の API を使う。
# トピック名は各トピックの `zenn_topics` に書く（URL の zenn.dev/topics/xxx の xxx）
zenn:
  enabled: true

  # このいいね数未満の記事は候補にしない
  min_likes: 100

  # 収集期間（日）。♥100 まで積み上がるには時間がかかるので短くしすぎない
  lookback_days: 60

  # 1トピックあたり何ページ取るか（1ページ48件、新しい順）。
  # 新しい順に返るため、3ページ（144件）では直近2〜3週間しか見られず、
  # ♥100 に達している記事がほとんど拾えない。窓の外に出たら自動で打ち切る
  max_pages: 10

# Qiita を使う場合はここを true に。設定はそのまま残してある
qiita:
  enabled: false
  min_likes: 100
  lookback_days: 60
  token_env: QIITA_TOKEN

# ============================================
#  記事の選定ルール（LLMは使わない）
# ============================================
selection:
  # 新しさの半減期（時間）。
  # 未設定（null）なら収集元ごとに「その収集ウィンドウの1/4」を自動で使う。
  #   RSS  : 30時間の窓  -> 半減期 7.5時間（数時間で古くなる）
  #   Zenn : 60日の窓    -> 半減期 15日  （数日前でもまだ新しい）
  # ニュースRSSと「♥100以上のZenn記事」では時間の流れが違うので、
  # 共通の固定値にすると必ずどちらかが一方的に負ける。通常は null のままでよい。
  # 数値を入れると全ソース共通の固定値になる。
  recency_half_life_hours: null

  # 半減期の下限（時間）。1日1回しか投稿しないので、24時間より短くすると
  # 前夜に出たニュースが朝の実行時点で減衰しきってしまう
  min_half_life_hours: 24

  # 収集元の出す比率。1回の実行で1つ枠を消化し、リストの先頭から順に回る。
  # 下の例は「RSS 3回に対して Zenn 1回」＝4日周期。
  # Zenn を減らしたいなら feed を増やす。完全に止めるなら [feed] だけにする。
  # 空リスト [] にするとローテーションせず純粋なスコア順になる。
  # 枠に該当する候補が無い日は、スコア順で選ぶ（投稿が飛ぶことはない）
  source_cycle: [feed, feed, feed, zenn]

  # 上位候補とスコアの内訳をログに出す（チューニング用）
  show_ranking: true

  # 信頼する媒体に加点。URL か媒体名に含まれる文字列でマッチ
  source_weights:
    publickey1.jp: 1.4
    itmedia.co.jp: 1.2
    atmarkit.itmedia.co.jp: 1.2
    zenn.dev: 1.0
    ledge.ai: 1.2
    gigazine.net: 1.0
    developer.mozilla.org: 1.4
    web.dev: 1.4
    github.blog: 1.3

  # エンゲージメント指標を持たない記事（RSS由来）に与える擬似スコア。
  # RSS のみで運用している間は全記事が同じ値になるので、実質的に効かない。
  # Qiita を併用するときだけ意味を持つ
  feed_base_score: 60

  # タイトルがこれより短い記事は捨てる（文字数）
  min_title_length: 8

  # タイトル末尾の媒体名（" - ITmedia NEWS" など）を落とすか。
  # 多くの媒体の RSS 利用条件は「発信元の表示」を求めており、
  # アイティメディアは発信元を表示しないことを明確に禁止事項としている。
  # 落とす必要がなければ false のままにしておくこと
  strip_source_from_title: false

  # 本文に媒体名を添える（タイトルに含まれていない場合のみ）
  show_source: true

  # 追加の除外パターン（正規表現）。PR・広告・まとめ系は既定で除外済み
  exclude_patterns: []

  # トピックごとに末尾へ付けるハッシュタグ
  hashtags_by_topic:
    "AI / LLM": "#AI"
    "フロントエンド / Web開発": "#frontend"
    "アクセシビリティ / SEO": "#a11y"
    "テック全般": "#tech"
