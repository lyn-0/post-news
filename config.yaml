# ============================================
#  興味のあるトピック設定
#  ここを書き換えるだけで収集対象が変わります
# ============================================

timezone: Asia/Tokyo

# 1回の実行で投稿する記事数。2本以上なら30分ずつずらして予約される
posts_per_run: 1

# 何時間前までの記事を候補にするか
lookback_hours: 30

# 投稿時刻（JST）。Buffer 側の予約に使うので、スクリプトの実行時刻とは独立。
# ジョブがこの時刻より後に走った場合は翌日ぶんとして予約される。
schedule_at: "09:30"

# 本文にリンクを含めるか。
# Buffer 経由なら X の従量課金（リンク付き $0.20）は発生しないので true でよい。
include_link: true

topics:
  - name: "AI / LLM"
    qiita_tags: ["LLM", "OpenAI", "生成AI"]
    zenn_topics: ["llm", "生成ai", "openai"]
    feeds:
      # Ledge.ai は公式RSSが無いため、有志が自動生成しているフィードを使う
      # （https://github.com/yoshiori/ledge-ai-feed / 毎時更新）
      - https://yoshiori.github.io/ledge-ai-feed/rss.xml
      - https://www.itmedia.co.jp/aiplus/subtop/features/rss.xml

  - name: "テック全般"
    feeds:
      # GIGAZINE のRSSは全カテゴリ混在（試食・アニメ・食なども流れてくる）。
      # include_categories で技術系だけに絞る。カテゴリ名は記事下部の表記と同じ
      - url: https://gigazine.net/news/rss_2.0/
        include_categories:
          - AI
          - ソフトウェア
          - ネットサービス
          - ハードウェア
          - セキュリティ
          - ウェブアプリ
          - サイエンス
      - https://www.publickey1.jp/atom.xml

  - name: "フロントエンド / Web開発"
    qiita_tags: ["React", "Next.js", "TypeScript"]
    zenn_topics: ["react", "nextjs", "typescript", "frontend"]
    feeds:
      - https://developer.mozilla.org/en-US/blog/rss.xml
      - https://github.blog/feed/

  - name: "アクセシビリティ / SEO"
    qiita_tags: ["アクセシビリティ", "SEO"]
    zenn_topics: ["accessibility", "seo"]
    feeds: []

# Zenn はいいね数（♥）が RSS に入っていないため、サイト内部の API を使う。
# トピック名は各トピックの `zenn_topics` に書く（URL の zenn.dev/topics/xxx の xxx）
zenn:
  enabled: true

  # このいいね数未満の記事は候補にしない
  min_likes: 100

  # 収集期間（日）。♥100 まで積み上がるには時間がかかるので短くしすぎない
  lookback_days: 60

  # 1トピックあたり何ページ取るか（1ページ48件、新しい順）
  max_pages: 3

# Qiita を使う場合はここを true に。設定はそのまま残してある
qiita:
  enabled: false
  min_likes: 100
  lookback_days: 60
  token_env: QIITA_TOKEN

# ============================================
#  記事の選定ルール（LLMは使わない）
# ============================================
selection:
  # 新しさの半減期（時間）。
  # 未設定（null）なら収集元ごとに「その収集ウィンドウの1/4」を自動で使う。
  #   RSS  : 30時間の窓  -> 半減期 7.5時間（数時間で古くなる）
  #   Zenn : 60日の窓    -> 半減期 15日  （数日前でもまだ新しい）
  # ニュースRSSと「♥100以上のZenn記事」では時間の流れが違うので、
  # 共通の固定値にすると必ずどちらかが一方的に負ける。通常は null のままでよい。
  # 数値を入れると全ソース共通の固定値になる。
  recency_half_life_hours: null

  # 半減期の下限（時間）。1日1回しか投稿しないので、24時間より短くすると
  # 前夜に出たニュースが朝の実行時点で減衰しきってしまう
  min_half_life_hours: 24

  # 前回投稿した収集元（zenn / feed / qiita）以外を優先する。
  # Zenn は「♥100以上・60日窓」、RSS は「30時間窓」でスコアの出方が構造的に違うため、
  # 数値調整だけで混ぜるのは難しい。交互に出すのが確実
  rotate_sources: true

  # 上位候補とスコアの内訳をログに出す（チューニング用）
  show_ranking: true

  # 信頼する媒体に加点。URL か媒体名に含まれる文字列でマッチ
  source_weights:
    publickey1.jp: 1.4
    itmedia.co.jp: 1.2
    zenn.dev: 1.0
    ledge.ai: 1.2
    gigazine.net: 1.0
    developer.mozilla.org: 1.4
    web.dev: 1.4
    github.blog: 1.3

  # エンゲージメント指標を持たない記事（RSS由来）に与える擬似スコア。
  # RSS のみで運用している間は全記事が同じ値になるので、実質的に効かない。
  # Qiita を併用するときだけ意味を持つ
  feed_base_score: 60

  # タイトルがこれより短い記事は捨てる（文字数）
  min_title_length: 8

  # タイトル末尾の媒体名（" - ITmedia NEWS" など）を落とす
  strip_source_from_title: true

  # 追加の除外パターン（正規表現）。PR・広告・まとめ系は既定で除外済み
  exclude_patterns: []

  # トピックごとに末尾へ付けるハッシュタグ
  hashtags_by_topic:
    "AI / LLM": "#AI"
    "フロントエンド / Web開発": "#frontend"
    "アクセシビリティ / SEO": "#a11y"
    "テック全般": "#tech"
