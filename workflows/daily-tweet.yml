name: daily-tweet

on:
  schedule:
    # 22:00 UTC = 翌 07:00 JST に起動し、Buffer に 09:30 JST の予約を積む。
    # 投稿時刻は Buffer が管理するので、cron が多少遅れても 9:30 の配信はズレない。
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Buffer に積まず内容だけ確認する"
        type: boolean
        default: true

permissions:
  contents: write   # state/posted.json のコミットに必要

concurrency:
  group: daily-tweet
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          # 任意。設定するとチャンネル解決の2リクエストを省略できる
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          # 任意。無認証だと Qiita API は 60回/時に制限される
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: |
          python src/main.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Commit posted history
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          git diff --staged --quiet || git commit -m "chore: update posted history"
          git push
